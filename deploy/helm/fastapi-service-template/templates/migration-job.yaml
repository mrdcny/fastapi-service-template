{{- if .Values.migrations.enabled }}
# Runs before the new pods roll out, once per release, instead of on every pod start.
# See docs/adr/0006-migrations-as-a-release-step.md.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fastapi-service-template.fullname" . }}-migrate
  labels:
    {{- include "fastapi-service-template.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "fastapi-service-template.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      # Hooks run before the chart's ServiceAccount exists on first install, so the
      # namespace default is used, with no API token mounted.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "fastapi-service-template.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "fastapi-service-template.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            {{- include "fastapi-service-template.env" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "fastapi-service-template.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
