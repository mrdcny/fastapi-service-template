# Local stack. `make deps` starts only Postgres and Jaeger (for `make run`);
# `docker compose up --build` runs everything, including the app in its production image.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 15

  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP/HTTP

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
    depends_on:
      db: { condition: service_healthy }

  app:
    build: .
    ports: ["8000:8000"]
    environment:
      APP_ENVIRONMENT: local
      APP_DATABASE_URL: postgresql+asyncpg://app:app@db:5432/app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      migrate: { condition: service_completed_successfully }
      jaeger: { condition: service_started }

volumes:
  pgdata:
